<script>
"use strict";
const get = id => document.getElementById(id);
const manifest = JSON.parse(get("item-manifest").textContent);
const items = manifest.items;
const storageKey = manifest.quizId + ":" + items[0].imageSha256 + ":confirmed";
let confirmed = "";
let storageAvailable = true;
function readProgress() {
  try {
    const stored = localStorage.getItem(storageKey) || "";
    return /^[1-3]{0,16}$/.test(stored) ? stored : "";
  } catch {
    storageAvailable = false;
    return confirmed;
  }
}
function paragraphs(container, lines) {
  container.replaceChildren(...lines.split("\n").map(line => {
    const p = document.createElement("p"); p.textContent = line; return p;
  }));
}
function render(advance) {
  const index = confirmed.length;
  if (index === items.length) {
    get("quiz").hidden = true; get("result").hidden = false;
    get("code").value = manifest.quizId + "|" + confirmed;
    if (advance) get("done").focus();
    return;
  }
  get("quiz").hidden = false; get("result").hidden = true;
  const item = items[index];
  const [objective,horizon,team,choices,response,legend,roster,rules] = item.prompt.split("\n\n");
  get("progress").textContent = "Position " + (index + 1) + " of " + items.length;
  get("fill").style.width = (100 * index / items.length) + "%";
  get("team").textContent = team; get("objective").textContent = objective;
  get("horizon").textContent = horizon; get("response").textContent = response;
  get("pitch").src = item.image; get("legend").textContent = legend;
  paragraphs(get("roster-text"),roster); paragraphs(get("rule-text"),rules);
  const options = get("options");
  options.querySelectorAll(".option").forEach(option => option.remove());
  choices.split("\n").forEach((choice, i) => {
    const label = document.createElement("label"); label.className = "option";
    const radio = document.createElement("input");
    radio.name = "choice"; radio.type = "radio"; radio.value = String(i+1);
    label.append(radio,document.createTextNode(choice)); options.append(label);
  });
  get("confirm").textContent = index + 1 === items.length ? "Finish quiz" : "Confirm pass";
  get("confirm").disabled = true;
  if (!storageAvailable) get("state-note").textContent = "Each confirmed choice is final. Keep this tab open until you copy the code.";
  if (advance) {
    get("team").focus({preventScroll:true});
    window.scrollTo(0,0);
  }
}
get("form").addEventListener("change", () => { get("confirm").disabled = false; });
get("form").addEventListener("submit", event => {
  event.preventDefault();
  const selected = get("options").querySelector("input:checked");
  if (!selected || confirmed.length >= items.length) return;
  const stored = readProgress();
  if (storageAvailable && stored.length > confirmed.length) {
    confirmed = stored; render(true); return;
  }
  confirmed += selected.value;
  try {localStorage.setItem(storageKey,confirmed);} catch {storageAvailable = false;}
  render(true);
});
window.addEventListener("storage", event => {
  if (event.key === storageKey && event.newValue && /^[1-3]{1,16}$/.test(event.newValue) && event.newValue.length > confirmed.length) {
    confirmed = event.newValue; render(true);
  }
});
get("copy").addEventListener("click", async () => {
  const input = get("code");
  try {await navigator.clipboard.writeText(input.value); get("copy-note").textContent = "Copied.";}
  catch {input.focus(); input.select(); get("copy-note").textContent = "Your code is selected. Use your device's Copy command.";}
});
confirmed = readProgress();
render(false);
</script>
